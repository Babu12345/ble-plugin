[package]
name = "esp_nimble_plugin_config"
version = "0.1.0"
edition = "2021"

[dependencies]
# Custom
plugin_config = { path = "../plugin_config" }
esp32-nimble = { git = "ssh://git@github.com/Babu12345/esp32-nimble.git", rev = "b9cd60de75bc71e404a2b06f8e66eecf9ae116a0", default-features = false, features = [
    "no_std",
] }
plugin-nvs = { path = "../plugin-nvs" }

# Crates
# Logging framework for debugging and monitoring
log = "0.4"
heapless = "0.9.1"
# ESP-IDF system services for task management and hardware interaction
esp-idf-svc = { version = "0.51", default-features = false }
# Error library for displaying errors
thiserror-no-std = "2.0.2"
throttle = "0.1.0"

# Thread pool for managing concurrent tasks
threadpool = "1.8.1"

syntax = "proto3";

package protocol;

// Message Type IDs for protocol dispatch. Only supports 2^16 possible values.
// Note: Each message type is identified by its corresponding MessageTypeId enum value
// when serialized. The protocol uses the MessageTypeId in the message header to
// determine which specific message type to deserialize.
// @derive(strum::EnumIter)
enum MessageTypeId {
  MessageTypeIdUnspecified = 0; // Proto3 requires a zero value
  
  // Host Commands
  // Configure BLE peripheral device with name and 6-byte address
  TypeHostCommandConfigurePeripheral = 0x01;
  // Create a new BLE service with specified u16 UUID
  TypeHostCommandConfigureService = 0x02;
  // Create a BLE characteristic with properties
  TypeHostCommandConfigureCharacteristic = 0x03;
  // Configure characteristic for read operations with default value
  TypeHostCommandConfigureCharacteristicRead = 0x04;
  // Query information about a BLE service
  TypeHostCommandGetServiceInfo = 0x05;
  // Query information about a BLE characteristic
  TypeHostCommandGetCharacteristicInfo = 0x06;
  // Start BLE advertising with optional multi-connect support
  TypeHostCommandStartAdvertisement = 0x07;
  // Send notification/indication to connected BLE client
  TypeHostCommandNotifyCharacteristicValue = 0x08;
  // Configure BLE security settings (pairing, bonding, passkey, etc.)
  TypeHostCommandConfigurePeripheralSecurity = 0x09;
  // Configure BLE profile with predefined services and characteristics
  TypeHostCommandConfigureProfile = 0x0A;
  // Stop BLE advertising
  TypeHostCommandStopAdvertisement = 0x0B;
  // Query bluetooth connections
  TypeHostCommandQueryConnections = 0x0C;
  
  // Plugin Responses
  // Data forwarded from BLE client to BLE plugin
  TypePluginData = 0x80;
  // Configuration error response from plugin
  TypePluginConfigurationError = 0x81;
  // Service information response with characteristic list
  TypePluginServiceInfoResponse = 0x82;
  // Characteristic information response with properties
  TypePluginCharacteristicInfoResponse = 0x83;
  // Authentication completed response from plugin
  TypePluginAuthenticationCompletedResponse = 0x84;
  // Central device on connect response
  TypePluginOnConnectResponse = 0x85;
}

// Host messages

// Host command. Configure peripheral
// Random Bluetooth addresses must follow specific MSB bit patterns:
// - Static Random: MSB bits = 11 (0xC0-0xFF), remaining 46 bits must have at least one 0 and one 1
// - Non-Resolvable Private: MSB bits = 00 (0x00-0x3F), remaining 46 bits must have at least one 0 and one 1
// Invalid pattern like 0xa1a1a1a1a1a1 has MSB bits = 10 (not allowed)
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandConfigurePeripheral))
message HostCommandConfigurePeripheral {
  // Peripheral name
  string name = 1;
  // Peripheral addr
  bytes addr = 2; // 6 bytes for Bluetooth address
}

// Host command. Configure peripheral security
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandConfigurePeripheralSecurity))
message HostCommandConfigurePeripheralSecurity {
  // Passkey for pairing (6 digit numeric)
  uint32 passkey = 1;
}

// Host command. Configure service
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandConfigureService))
message HostCommandConfigureService {
  // Service UUID (u16)
  uint32 uuid = 1; // u16 in Rust, using uint32 in proto3
}

// Properties enumeration for BLE characteristics
// @derive(serde::Deserialize, serde::Serialize)
enum BleProperties {
  BlePropertiesUnspecified = 0; // Proto3 requires a zero value
  // Read property
  Read = 1;
  // Write property
  WriteRsp = 2;
  // Write without response property
  WriteNoRsp = 3;
  // Notify property
  Notify = 4;
  // Indicate property
  Indicate = 5;
}

// Host command. Configure characteristic
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandConfigureCharacteristic))
message HostCommandConfigureCharacteristic {
  // Characteristic UUID (u16)
  uint32 uuid = 1; // u16 in Rust
  // Service UUID (u16) this characteristic belongs to
  uint32 service_uuid = 2; // u16 in Rust
  // Properties of the characteristic (read, write, notify, etc.)
  repeated BleProperties properties = 3; // Max 4 properties per characteristic
}

// Host command. Configure characteristic read
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandConfigureCharacteristicRead))
message HostCommandConfigureCharacteristicRead {
  // Characteristic UUID (u16)
  uint32 uuid = 1; // u16 in Rust
  // Service UUID (u16) this characteristic belongs to
  uint32 service_uuid = 2; // u16 in Rust
  // Read value
  bytes value = 3; // Max MAX_NAME_SIZE bytes
}

// Host command. Get service info
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandGetServiceInfo))
message HostCommandGetServiceInfo {
  // Service UUID (u16)
  uint32 uuid = 1; // u16 in Rust
}

// Host command. Get characteristic info
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandGetCharacteristicInfo))
message HostCommandGetCharacteristicInfo {
  // Characteristic UUID (u16)
  uint32 characteristic_uuid = 1; // u16 in Rust
  // Service UUID (u16) this characteristic belongs to
  uint32 service_uuid = 2; // u16 in Rust
}

// Host command. Start advertisement. TODO: Allow selecting which services you want to advertise
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandStartAdvertisement))
message HostCommandStartAdvertisement {
  // Allow multiple central connections
  bool allow_multi_connect = 1;
}

// Host command. Stop all advertisement
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandStopAdvertisement))
message HostCommandStopAdvertisement {
  // Empty message
}

// Bluetooth Device address type
// @derive(serde::Deserialize, serde::Serialize)
enum BluetoothAddressType {
  BluetoothAddressTypeUnspecified = 0; // Proto3 requires a zero value
  // Public address
  Public = 1;
  // Random address
  Random = 2;
  // Public ID address
  PublicId = 3;
  // Random ID address
  RandomId = 4;
}

// Host command. Notify characteristic value
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandNotifyCharacteristicValue))
message HostCommandNotifyCharacteristicValue {
  // Device Address
  bytes address = 1; // 6 bytes
  // Address type
  BluetoothAddressType address_type = 2;
  // Characteristic UUID (u16)
  uint32 characteristic_uuid = 3; // u16 in Rust
  // Service UUID (u16) this characteristic belongs to
  uint32 service_uuid = 4; // u16 in Rust
  // Value to notify
  bytes value = 5; // Max MAX_NAME_SIZE bytes
}

// Host command. Query connections
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandQueryConnections))
message HostCommandQueryConnections {
}

// Plugin connection response.
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypePluginOnConnectResponse))
message PluginOnConnectResponse {
  // Device Address
  bytes address = 1; // 6 bytes
  // Address type
  BluetoothAddressType address_type = 2;
}

// Profile type enumeration for preconfigured BLE profiles
// @derive(serde::Deserialize, serde::Serialize)
enum BleProfile {
  BleProfileUnspecified = 0; // Proto3 requires a zero value
  // Custom profile - user-defined services
  Custom = 1;
  // Heart Rate Monitor profile
  HeartRateMonitor = 2;
  // Battery Service profile
  BatteryService = 3;
  // Device Information Service profile
  DeviceInformation = 4;
}

// Host command. Configure BLE profile
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::HostIO(MessageTypeId::TypeHostCommandConfigureProfile))
message HostCommandConfigureProfile {
  // Profile type to configure
  BleProfile profile = 1;
}

// Plugin messages

// Represents the send type of the data. Was it due to a
// write event (central -> peripheral), notify event (peripheral -> central),
// or read attempt (central -> peripheral). Depending on which, a response
// might be expected or sent
// @derive(serde::Deserialize, serde::Serialize)
enum PluginDataSendType {
  PluginDataSendTypeUnspecified = 0; // Proto3 requires a zero value
  // Notified from the central bluetooth device
  NotifyType = 1;
  // Read attempt from the central bluetooth device
  ReadType = 2;
  // Written from the central bluetooth device
  WriteType = 3;
}

// Plugin data
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::PluginIO(MessageTypeId::TypePluginData))
message PluginData {
  // Source peripheral addr that this data is originating from
  bytes src_addr = 1; // 6 bytes
  // Address type of the source peripheral
  BluetoothAddressType src_addr_type = 2;
  // Send type of the data
  PluginDataSendType send_type = 3;
  // Characteristic UUID (u16)
  uint32 characteristic_uuid = 4; // u16 in Rust
  // Service UUID (u16) this characteristic belongs to
  uint32 service_uuid = 5; // u16 in Rust
  // Actual command type
  bytes data = 6;
}

// Error type enumeration for plugin configuration errors
// @derive(serde::Deserialize, serde::Serialize)
enum PluginConfigurationErrorType {
  PluginConfigurationErrorTypeUnspecified = 0; // Proto3 requires a zero value
  // The peripheral name is too long
  PeripheralNameTooLong = 1;
  // The peripheral address is invalid
  InvalidPeripheralUuid = 2;
  // The service UUID (u16) is invalid
  InvalidServiceUuid = 3;
  // The characteristic UUID (u16) is invalid
  InvalidCharacteristicUuid = 4;
  // Advertisement without proper peripheral configuration
  AdvertisementWithoutPeripheralConfiguration = 5;
  // Service without proper peripheral configuration
  ServiceWithoutPeripheralConfiguration = 6;
  // Characteristic without proper service configuration
  CharacteristicWithoutServiceConfiguration = 7;
}

// Plugin configuration error message
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::PluginIO(MessageTypeId::TypePluginConfigurationError))
message PluginConfigurationError {
  // The type of configuration error
  PluginConfigurationErrorType error_type = 1;
}

// Service information response
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::PluginIO(MessageTypeId::TypePluginServiceInfoResponse))
message PluginServiceInfoResponse {
  // Service UUID (u16)
  uint32 service_uuid = 1; // u16 in Rust
  // List of characteristic UUIDs (u16) in this service
  repeated uint32 characteristic_uuids = 2; // u16 array, max 16 characteristics per service
  // Whether the service exists
  bool exists = 3;
}

// Characteristic information response
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::PluginIO(MessageTypeId::TypePluginCharacteristicInfoResponse))
message PluginCharacteristicInfoResponse {
  // Characteristic UUID (u16)
  uint32 characteristic_uuid = 1; // u16 in Rust
  // Service UUID (u16) this characteristic belongs to
  uint32 service_uuid = 2; // u16 in Rust
  // Properties of the characteristic (read, write, notify, etc.)
  repeated BleProperties properties = 3; // Max 4 properties
  // Whether the characteristic exists
  bool exists = 4;
}

// Plugin authentication completed response
// @derive(serde::Deserialize, serde::Serialize)
// @rust_macro(protocol_io::PluginIO(MessageTypeId::TypePluginAuthenticationCompletedResponse))
message PluginAuthenticationCompletedResponse {
  // Address of the device that was authenticated
  bytes address = 1; // 6 bytes
  // Address type
  BluetoothAddressType address_type = 2;
  // Whether the authentication was successful
  bool success = 3;
}
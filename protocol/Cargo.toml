[package]
name = "protocol"
version = "0.1.0"
edition = "2021"


[dependencies]
# Custom
lib_utils = { path = "../lib_utils" }
protocol_io = { path = "../protocol_io" }
# Crates
serde = { version = "^1.0.217", default-features = false, features = [
    "derive",
    "alloc",
] }
bincode = { version = "2.0.1", default-features = false, features = [
    "serde",
    "alloc",
], optional = true }
log = "0.4"
embassy-sync = { version = "0.6.1", default-features = false }
# prost = { version = "0.14.1", default-features = false, optional = true, features = ["derive"] }
prost = { git = "https://github.com/Babu12345/prost", default-features = false, optional = true, features = [
    "derive",
] }
quick-protobuf = { version = "0.8", default-features = false, optional = true }
heapless = { version = "0.8.0" }
strum = { version = "0.27.2", default-features = false, features = ["derive"] }

[build-dependencies]
prost-build = { version = "0.14.1", optional = true }
pb-rs = { version = "0.10.0", optional = true }

[lib]
doctest = false

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread"] }
critical-section = "1.0"

[features]
default = ["std", "protocol_buffer"]
std = ["serde/std", "prost/std", "quick-protobuf/std"]
bincode_serialization = ["bincode"]
protocol_buffer = ["prost", "prost-build"]
quick_protocol_buffer = ["quick-protobuf", "pb-rs"]

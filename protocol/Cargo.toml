[package]
name = "protocol"
version = "0.1.0"
edition = "2021"


[dependencies]
# Custom
lib_utils = { path = "../lib_utils" }
protocol_io = { path = "../protocol_io" }
# Crates
serde = { version = "1.0.219", default-features = false, features = [
    "derive",
    "alloc",
] }
bincode = { version = "2.0.1", default-features = false, features = [
    "serde",
], optional = true }
uuid = { version = "1.17.0", default-features = false, features = ["serde"] }
log = "0.4"
embassy-sync = { version = "0.6.1", default-features = false }
strum = { version = "0.27.2", default-features = false, features = ["derive"] }
# prost = { version = "0.14.1", default-features = false, features = ["derive"] }
prost = { git = "https://github.com/Babu12345/prost", default-features = false, features = [
    "derive",
] }
heapless = { version = "0.8.0" }

[build-dependencies]
prost-build = "0.14.1"

[lib]
doctest = false

[features]
default = ["std", "protocol_buffers"]
std = ["serde/std", "bincode/alloc", "prost/std"]
bincode_serialization = ["bincode"]
protocol_buffers = []

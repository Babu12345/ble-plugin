[package]
name = "protocol"
version = "0.1.0"
edition = "2021"


[dependencies]
# Custom
lib_utils = { path = "../lib_utils" }

# Crates
heapless = { version = "0.8.0", features = ["serde"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
bincode = { version = "2.0.1", default-features = false, features = ["serde"] }
uuid = { version = "1.17.0", default-features = false, features = ["serde"] }
log = "0.4"

[features]
default = ["std"]
std = ["serde/std", "bincode/alloc"]

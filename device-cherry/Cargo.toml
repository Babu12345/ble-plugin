[package]
name = "device-cherry"
version = "0.1.0"
edition = "2024"


[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[dependencies]
# Custom
protocol = { path = "../protocol", default-features = false, features = [
    "protocol_buffer",
] }
lib_utils = { path = "../lib_utils" }

# Crates
log = { version = "0.4.27", default-features = false }
esp-idf-sys = { version = "0.36.1", default-features = false }
heapless = "0.8.0"
static_cell = "2"
embassy-futures = "0.1.1"
ringbuffer = { version = "0.15.0", default-features = false }
embassy-sync = "0.7.0"
esp-idf-svc = { version = "0.51", default-features = false }
thiserror-no-std = "2.0.2"
throttle = "0.1.0"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = "components/cherryusb"
bindings_header = "cherry_usb_device_bindings.h"
bindings_module = "cherry_device"

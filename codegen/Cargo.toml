[package]
name = "codegen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-python"
path = "src/bin/generate_python.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
askama = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[dependencies.protocol]
path = "../protocol"

[dev-dependencies]
tempfile = "3.0"
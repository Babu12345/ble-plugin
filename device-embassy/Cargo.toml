[package]
name = "device-embassy"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[target.'cfg(all(target_arch = "xtensa", target_os = "none"))'.dependencies]
protocol = { git = "ssh://git@github.com/Babu12345/ble-plugin.git", default-features = false, features = [
    "quick_protocol_buffer",
] }
lib_utils = { path = "../lib_utils" }

## External crates
esp-alloc = "0.7.0"

esp-hal = { version = "1.0.0-beta.0", features = ["unstable"] }

log = { version = "0.4.21" }
embassy-executor = { version = "0.7.0", features = ["task-arena-size-65536"] }

embassy-time = { version = "^0.4", features = ["generic-queue-8"] }
static_cell = { version = "2.1.0", features = ["nightly"] }
embassy-usb = "0.4.0"
embassy-futures = "0.1.1"
heapless = "0.8.0"
embassy-sync = { version = "0.6.1", default-features = false }


[features]
default = ["esp32s3"]
esp32s3 = ["esp-hal/esp32s3"]
esp32s2 = ["esp-hal/esp32s2"]
esp32c3 = ["esp-hal/esp32c3"]

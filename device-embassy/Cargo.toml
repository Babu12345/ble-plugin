[package]
name = "device-embassy"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
protocol = { git = "ssh://git@github.com/Babu12345/ble-plugin.git", default-features = false, features = [
    "quick_protocol_buffer",
] }

## External crates
esp-backtrace = { version = "0.15.1", features = [
    "exception-handler",
    "panic-handler",
    "println",
] }
esp-alloc = "0.7.0"

esp-hal = { version = "1.0.0-beta.0", features = ["unstable"] }
esp-println = { version = "0.13.1", features = ["log"] }

log = { version = "0.4.21" }
embassy-executor = { version = "0.7.0", features = ["task-arena-size-65536"] }

embassy-time = { version = "^0.4", features = ["generic-queue-8"] }
esp-hal-embassy = { version = "0.9.0" }
static_cell = { version = "2.1.0", features = ["nightly"] }
embassy-usb = "0.4.0"
embassy-futures = "0.1.1"
heapless = "0.8.0"
embassy-sync = { version = "0.6.1", default-features = false }


[features]
default = ["esp32s3"]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-hal-embassy/esp32s3",
    "esp-println/esp32s3",
]
esp32s2 = [
    "esp-hal/esp32s2",
    "esp-backtrace/esp32s2",
    "esp-hal-embassy/esp32s2",
    "esp-println/esp32s2",
]

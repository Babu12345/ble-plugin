[package]
name = "plugin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "plugin"
path = "src/bin/main.rs"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[dependencies]
## Files in shared directory
lib_utils = {path = "../lib_utils"}
protocol = {path = "../protocol"}
## Crates
esp32-nimble = "0.11.0"
log = "0.4"
esp-idf-sys = { version = "0.36.1", default-features = false }
esp-println = { version = "0.13.1", features = ["esp32s3", "log"] }
esp-idf-svc = { version = "0.51", features = ["alloc", "binstart", "embassy-time-driver", "embassy-sync"], default-features = false }
static_cell = "2"
heapless = "0.8.0"
embassy-futures = "0.1.1"

[build-dependencies]
embuild = "0.33"
[package]
name = "plugin_state_machine_std"
version = "0.1.0"
edition = "2021"
authors = ["BLE Plugin Team"]
description = "BLE-USB bridge state machine for ESP32-based plugin devices"
documentation = "https://docs.rs/plugin_state_machine_std"
readme = "README.md"
repository = "https://github.com/your-org/ble-plugin"
keywords = ["ble", "usb", "esp32", "embedded", "bridge"]
categories = ["embedded", "hardware-support", "network-programming"]
rust-version = "1.70"

[dependencies]
# Local protocol definitions
protocol = { path = "../protocol", default-features = false, features = [
    "std",
] }
plugin_config = { path = "../plugin_config" }

# Logging framework for debugging and monitoring
log = "0.4"

# UUID handling for BLE service and characteristic identifiers
uuid = { version = "1.17.0", default-features = false }

# Error library for displaying errors
thiserror-no-std = "2.0.2"

[lib]
doctest = false

[features]
default = ["protocol_buffer"]
protocol_buffer = ["protocol/protocol_buffer"]
quick_protocol_buffer = ["protocol/quick_protocol_buffer"]

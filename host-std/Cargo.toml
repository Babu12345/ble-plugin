[package]
name = "ble-plugin"
version = "0.1.0"
authors = ["Babu-Abel Wanyeki <bwanyeki12@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "host"
path = "src/bin/main.rs"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

[dependencies]
## Files in shared directory
lib_utils = {path = "../lib_utils"}
protocol = {path = "../protocol"}
host-esp ={ path = "../host-esp" }
## Crates
log = "0.4"
esp-idf-sys = { version = "0.36.1", default-features = false }
esp-println = { version = "0.13.1", features = ["esp32s3", "log"] }
esp-idf-svc = { version = "0.51", features = ["alloc", "binstart", "embassy-time-driver", "embassy-sync"], default-features = false }
static_cell = "2"
heapless = "0.8.0"
embassy-futures = "0.1.1"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/usb_host_cdc_acm", version = "2.0.6" }
bindings_header = "usb_host_bindings.h"
bindings_module = "host"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "cherry-embedded/cherryusb", version = "1.4.100" }
bindings_header = "cherry_usb_host_bindings.h"
bindings_module = "cherry_host"

# https://github.com/esp-rs/esp-idf-sys/blob/master/BUILD-OPTIONS.md
# Use this to import the remote components via a git. Make sure the idf_component.yml url and versions are correct
# [package.metadata.esp-idf-sys.extra_components.1.remote_component]
# name = "cherry-embedded/cherryusb"
# git = "whttps://github.com/cherry-embedded/CherryUSB.git"
# version = "1.4.100"
# bindings_header = "cherry_usb_host_bindings.h"
# bindings_module = "cherry_host"

[build-dependencies]
embuild = "0.33"

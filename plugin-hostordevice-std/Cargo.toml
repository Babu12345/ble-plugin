[package]
name = "plugin-hostordevice-std"
version = "0.1.0"
authors = ["Babu-Abel Wanyeki <bwanyeki12@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[profile.release]
opt-level = 3

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[dependencies]
# Local crates
device-cherry = { path = "../device-cherry" }
host-cherry = { path = "../host-cherry" }
plugin_state_machine_std = { path = "../plugin_state_machine_std" }
plugin-nvs = { path = "../plugin-nvs" }
protocol = { path = "../protocol", default-features = false, features = [
    "std",
    "protocol_buffer",
] }
esp_nimble_plugin_config = { path = "../esp_nimble_plugin_config" }
## Crates
esp-idf-sys = { version = "0.36.1", default-features = false }
esp-println = { version = "0.13.1", features = ["esp32s3", "log"] }
esp-idf-svc = { version = "0.51", features = [
    "alloc",
    "binstart",
    "embassy-time-driver",
    "embassy-sync",
], default-features = false }
# Logging framework for debugging and monitoring
log = "0.4"

[build-dependencies]
embuild = "0.33"

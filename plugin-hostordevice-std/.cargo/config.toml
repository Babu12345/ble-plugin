[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --no-stub -s 8mb -f 80mhz --baud 115200"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort", "core"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.3"
# https://github.com/esp-rs/esp-idf-sys/blob/master/BUILD-OPTIONS.md#esp_idf_tools_install_dir-esp_idf_tools_install_dir
ESP_IDF_TOOLS_INSTALL_DIR = { value = "global" }

[alias]
r = "run --release"

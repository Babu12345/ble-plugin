[package]
name = "device-jtag"
version = "0.1.0"
edition = "2024"

[target.'cfg(all(target_arch = "xtensa", target_os = "espidf"))'.dependencies]
# Custom
protocol = { path = "../protocol", default-features = false, features = [
    "std",
] }
lib_utils = { path = "../lib_utils" }

# Crates
log = "0.4"
esp-idf-sys = { version = "0.36.1", default-features = false }
heapless = "0.8.0"
esp-idf-svc = { version = "0.51", default-features = false }
thiserror-no-std = "2.0.2"

[features]
default = ["protocol_buffer"]
protocol_buffer = ["protocol/protocol_buffer"]

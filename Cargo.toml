[workspace]
members = ["protocol", "protocol_io", "lib_utils", "device-embassy"]
exclude = [
    "plugin-nvs",
    "plugin_state_machine_std",
    "plugin-std",
    "host-std",
    "plugin-echo-example",
    "plugin-no-std",
    "plugin-host-std",
    "device-cherry",
    "host-cherry",
    "host-no-std",
]
resolver = "2"


[workspace.package]
version = "0.0.1"
authors = ["Babuabel Wanyeki <bwanyeki12@gmail.com>"]
repository = "https://github.com/Babu12345/ble-plugin"
edition = "2021"

[profile.bench]
debug = true

[profile.release]
debug = false
opt-level = "s"
